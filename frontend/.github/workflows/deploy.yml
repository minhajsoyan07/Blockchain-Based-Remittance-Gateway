name: Deploy to GCP (Cloud Run + Firebase Hosting)

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCLOUD_PROJECT }}
          export_default_credentials: true

      - name: Configure Docker auth for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push container image
        run: gcloud builds submit --tag gcr.io/${{ secrets.GCLOUD_PROJECT }}/remittancepay

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy remittancepay \
            --image gcr.io/${{ secrets.GCLOUD_PROJECT }}/remittancepay \
            --platform managed \
            --region ${{ secrets.GCLOUD_REGION }} \
            --allow-unauthenticated

      - name: Install Firebase CLI
        run: curl -sL https://firebase.tools | bash

      - name: Deploy Firebase Hosting (rewrites to Cloud Run)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --token "$FIREBASE_TOKEN"
